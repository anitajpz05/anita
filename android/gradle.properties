# The local ISP's Google Global Cache edge node serves stale 404s over IPv4
# for recently-published Maven artifacts (confirmed: `curl -4` on dl.google.com
# returns 404 for AGP 9.1.0's transitive artifacts, `curl -6` returns 200).
# preferIPv6Addresses alone isn't enough -- a 404 is a valid HTTP response,
# so Gradle's HTTP client has no reason to retry over IPv6. preferIPv6Stack
# disables the IPv4 stack outright so every request goes out over IPv6.
# NOTE: these must be systemProp.* (real -D flags on the daemon's actual JVM
# launch), not org.gradle.jvmargs -- Gradle applies -D entries from jvmargs
# to a running daemon via System.setProperty(), which is too late for the
# network stack (it caches preferIPv6Stack the first time InetAddress is used).
systemProp.java.net.preferIPv6Stack=true
systemProp.java.net.preferIPv6Addresses=true
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
